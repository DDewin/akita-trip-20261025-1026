  .card .photo { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); }

  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: .88rem; margin: 10px 0 0; }

  .btn {

  .btn.ghost { border: 1px solid var(--line); color: var(--text); background: transparent; }
  .btn svg { width: 18px; height: 18px; flex: none; }

  .move .card { background: transparent; box-shadow: none; border: 1px dashed var(--line); }
  .move .body { padding: 10px 14px; }
  .move .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .move .eta { font-weight: 700; }
  .move .route { color: var(--muted); font-size: .88rem; margin: 2px 0 0; }
  .move .btn { min-height: 38px; padding: 0 12px; font-size: .88rem; }

  section.extra { padding: 20px 0; }
  section.extra h2 { font-size: 1.2rem; margin: 0 0 12px; }
  table.budget { width: 100%; border-collapse: collapse; font-size: .9rem; background: var(--surface); border-radius: 12px; overflow: hidden; }
  table.budget th, table.budget td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.budget tbody th { background: var(--surface-2); font-size: .85rem; }
  table.budget td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.budget tfoot td { font-weight: 700; }
  table.budget .note { display: block; color: var(--muted); font-size: .8rem; }
  .checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .checklist li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

  .checklist b { display: block; }
  .checklist span { color: var(--muted); font-size: .88rem; }

  footer { color: var(--muted); font-size: .78rem; padding: 24px 0 40px; }

      { type: "move", time: "15:30 – 15:50", eta: "約 20 分鐘", dist: "約 12 km", fee: "免費",
        route: "沿湖畔道路繞到湖東側（田澤湖橋附近）", q: "山のはちみつ屋 仙北市田沢湖生保内石神163-3" },
      { type: "spot", time: "15:50 – 16:20", stay: "停留約 30 分鐘（下午茶）", name: "山之蜂蜜屋", ja: "山のはちみつ屋（仙北市田沢湖生保内石神163-3）",
        photo: "lake", q: "山のはちみつ屋 仙北市田沢湖生保内石神163-3",
        html: `<p>蜂巢造型的圓頂木屋，吃蜂蜜冰淇淋、試吃在地蜂蜜，順便買伴手禮。</p>`,
        cost: "蜂蜜冰淇淋約 ¥400",
        note: "停車位充足。營業 9:00–17:30（冬季至 17:00）。" },
      { type: "move", time: "16:20 – 19:20", eta: "約 3 小時", dist: "約 240 km", fee: "高速費約 ¥4,490",
        route: "國道 46 號 ➜ 盛岡 IC ➜ 東北自動車道南下 ➜ 仙台", tip: "國道 46 號山路段約 17:00 後天黑，請小心駕駛。中途可在紫波 SA 或前澤 SA 休息、買伴手禮。", q: "仙台駅" },
      { type: "spot", time: "約 19:20", name: "返抵仙台站", ja: "仙台駅", photo: "sendai", q: "仙台駅",
        desc: "還車、圓滿結束旅程！" },
    ]
  }
];

const budget = [
  ["租車", "交通", 17860, "兩天"],
  ["油資", "交通", 7000, "總里程約 570 km"],
  ["高速公路過路費", "交通", 10850, "仙台-橫手 4,490 + 橫手-秋田 1,870 + 盛岡-仙台 4,490"],
  ["住宿 EN HOTEL Akita", "其他", 6783, "一晚"],
  ["故里村 Wonder Castle", "其他", 1200, "門票｜成人 700 + 國小 500"],
  ["民俗藝能傳承館", "其他", 100, "門票｜國小兒童免費"],
  ["久保田城御隅櫓", "其他", 100, "門票｜國小兒童免費"],
];

const checklist = [
  ["ETC 卡確認", "出發前確認車載器已插入 ETC 卡並感應正常。"],
  ["孩子車上娛樂與保暖", "單趟車程 1–3 小時，備好音樂／故事、保溫壺、小薄毯。"],
  ["故里村滑梯服裝", "Wonder Castle 巨型滑梯需穿長褲與平底鞋，現場戴安全帽。"],
  ["換洗衣物與毛巾", "跑跳流汗後可在車上換衣服。"],
  ["田澤湖防風外套", "湖邊風涼，餵魚時留意孩子腳步。"],
  ["手機導航準備", "安裝 Google 地圖 App，出發前開好行動網路或 eSIM，車上備手機架與充電線。"],
];

const yen = (n) => "¥" + n.toLocaleString("ja-JP");
const GROUP_DESC = { "交通": "租車、油費、過路費", "其他": "住宿、門票" };
// 依分類加總；不帶參數則為全部合計
const sum = (g) => budget.filter(b => !g || b[1] === g).reduce((a, b) => a + b[2], 0);

function spotCard(it, color) {
  const p = it.photo && photos[it.photo];
  const photo = p ? `<div class="photo"><img src="${p.src}" alt="${it.name}" loading="lazy" decoding="async">
      <a class="credit" href="https://commons.wikimedia.org/wiki/${encodeURI(p.page)}" target="_blank" rel="noopener">${p.note ? p.note + "・" : ""}© ${p.by}</a></div>` : "";
  const info = [
    it.cost && `<dt>費用</dt><dd>${it.cost}</dd>`,
    it.note && `<dt>備註</dt><dd>${it.note}</dd>`,
  ].filter(Boolean).join("");
  return `<li style="--dot:${color}"><article class="card">${photo}<div class="body">
      <div class="time">${it.time}${it.stay ? `<span style="color:var(--muted);font-weight:500">｜${it.stay}</span>` : ""}</div>
      <h3>${it.name}</h3>
      <p class="ja">${it.ja}</p>
      ${it.desc ? `<p>${it.desc}</p>` : ""}${it.html || ""}
      ${info ? `<dl class="info">${info}</dl>` : ""}
      ${it.warn ? `<p class="warn">注意：${it.warn}</p>` : ""}
      <div class="actions">
        <a class="btn primary" href="${nav(it.q)}" target="_blank" rel="noopener">${ICON_NAV}開始導航</a>
        <a class="btn ghost" href="${view(it.q)}" target="_blank" rel="noopener">${ICON_PIN}地圖</a>
      </div>
    </div></article></li>`;
}

function moveCard(it) {
  return `<li class="move"><div class="card"><div class="body">
      <div class="row">
        <div><span class="eta">🚗 ${it.eta}</span>　<span style="color:var(--muted)">${it.dist}｜${it.fee}</span></div>
        <a class="btn ghost" href="${nav(it.q)}" target="_blank" rel="noopener">${ICON_NAV}導航下一站</a>
      </div>
      <p class="route">${it.time}｜${it.route}</p>
      ${it.tip ? `<p class="route">${it.tip}</p>` : ""}
    </div></div></li>`;
}

const app = document.getElementById("app");
app.innerHTML = days.map(d => `
  <section class="day" id="${d.id}">
    <div class="day-title"><span class="day-badge" style="background:${d.color}">${d.label}</span><h2>${d.title}</h2></div>
    <p class="day-sub">${d.sub}</p>
    <ol class="timeline">${d.items.map(it => it.type === "move" ? moveCard(it) : spotCard(it, d.color)).join("")}</ol>
  </section>`).join("") + `
  <section class="extra" id="budget">
    <h2>預估費用（不含餐費）</h2>
    <table class="budget">
      <thead><tr><th>項目</th><th>金額</th></tr></thead>
      ${["交通", "其他"].map(g => `<tbody>
        <tr><th colspan="2">${g}費用（${GROUP_DESC[g]}）</th></tr>
        ${budget.filter(b => b[1] === g).map(([n, , v, s]) => `<tr><td>${n}<span class="note">${s}</span></td><td class="num">${yen(v)}</td></tr>`).join("")}
        <tr><td><b>小計</b></td><td class="num"><b>${yen(sum(g))}</b></td></tr>
      </tbody>`).join("")}
      <tfoot><tr><td>合計</td><td class="num">${yen(sum())}</td></tr></tfoot>
    </table>
  </section>
  <section class="extra" id="checklist">
    <h2>行前準備清單</h2>
    <ul class="checklist">${checklist.map(([t, s], i) => `<li><label><input type="checkbox" data-k="c${i}"><div><b>${t}</b><span>${s}</span></div></label></li>`).join("")}</ul>
  </section>`;

// 頁首金額跟著預算表自動計算
document.getElementById("sum-traffic").textContent = yen(sum("交通"));
document.getElementById("sum-other").textContent = yen(sum("其他"));
document.getElementById("sum-all").textContent = yen(sum());

// 勾選狀態只存在這支手機的瀏覽器中
document.querySelectorAll(".checklist input").forEach(el => {
  try { el.checked = localStorage.getItem("akita-" + el.dataset.k) === "1"; } catch (e) {}
  el.addEventListener("change", () => {
    try { localStorage.setItem("akita-" + el.dataset.k, el.checked ? "1" : "0"); } catch (e) {}
  });
});

document.getElementById("credits").innerHTML = Object.values(photos).map(p =>
  `<li><a href="https://commons.wikimedia.org/wiki/${encodeURI(p.page)}" target="_blank" rel="noopener">${p.page.replace("File:", "")}</a>，${p.by}，${p.lic}</li>`).join("");
</script>
</body>
